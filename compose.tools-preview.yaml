services:
  image-tools-preview:
    image: ${IMAGE_TOOLS_IMAGE_REF:?IMAGE_TOOLS_IMAGE_REF is required}
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - .env.preview
    environment:
      IMAGE_TOOLS_HOST: 0.0.0.0
      IMAGE_TOOLS_PORT: "8091"
      IMAGE_TOOLS_MAX_INFLIGHT_REQUESTS: "1"
    ports:
      - 127.0.0.1:18091:8091
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8091),2); s.close()"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 20s
